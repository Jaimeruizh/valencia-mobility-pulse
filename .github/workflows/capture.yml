# Saves a copy of the València live mobility feeds and rebuilds the dashboard, with no computer switched on.
# To use it: put this folder in a GitHub repository and turn on GitHub Pages (Settings > Pages > Deploy from branch > main).
# The dashboard is then public at https://<account>.github.io/<repository>/dashboard.html and refreshes itself.
name: Capture València mobility data

on:
  schedule:
    - cron: '7 * * * *'   # once an hour, at minute 7 (GitHub may start scheduled jobs a few minutes late)
  workflow_dispatch:        # also adds a "Run workflow" button for a capture on demand

permissions:
  contents: write           # the job saves the new data into the repository

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Madrid      # capture times are written in València local time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture the live feeds
        run: node capture.js --no-build
      - name: Rebuild the dashboard and the light tables
        run: node build_page.js
      - name: Save the new data
        run: |
          git config user.name "mobility-capture"
          git config user.email "mobility-capture@users.noreply.github.com"
          git add -A data kit dashboard*.html
          git diff --cached --quiet || git commit -m "Capture $(date +'%Y-%m-%d %H:%M')"
          git push || (git pull --rebase && git push)
